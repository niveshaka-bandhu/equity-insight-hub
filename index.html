<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Niveshaka-bandhu — Investor's Friend</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;font-size:13px;color:#1a1a1a;background:#efefef;min-height:100vh}
a{text-decoration:none;color:inherit}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px}
:root{--red:#c0392b;--green:#1a7a4a;--orange:#e07b00;--blue:#0d47a1;--mc:#0060df;--bdr:#e0e0e0;--bgh:#f5f7ff;}

.topbar{background:#0d47a1;color:#cfe2ff;font-size:11px;padding:5px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
header{background:#fff;border-bottom:3px solid var(--mc);box-shadow:0 2px 6px rgba(0,0,0,.1);position:sticky;top:0;z-index:300}
.hdr{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 14px;height:54px}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.lhn{font-family:'Teko',sans-serif;font-size:24px;color:var(--mc);line-height:1;letter-spacing:1px}
.len{font-family:'Teko',sans-serif;font-size:16px;font-weight:600;color:#111;line-height:1.1}
.lsl{font-size:9px;color:#999;letter-spacing:.5px;text-transform:uppercase}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.nb{padding:6px 10px;border-radius:3px;font-size:11px;font-weight:600;color:#444;cursor:pointer;border:none;background:none;transition:.2s;white-space:nowrap;font-family:'Inter',sans-serif}
.nb:hover{background:#e8f0ff;color:var(--mc)}.nb.on{background:var(--mc);color:#fff}
.rbtn{padding:5px 10px;border-radius:3px;font-size:11px;font-weight:600;color:var(--mc);cursor:pointer;border:1px solid var(--mc);background:#fff;font-family:'Inter',sans-serif;flex-shrink:0;transition:.2s}
.rbtn:hover{background:var(--mc);color:#fff}.rbtn:disabled{opacity:.5;cursor:not-allowed}

.ticker{background:#fff;border-bottom:1px solid #e8e8e8;overflow:hidden;height:30px;display:flex;align-items:center}
.tscrl{display:flex;align-items:center;animation:tsc 60s linear infinite;white-space:nowrap}
.tscrl:hover{animation-play-state:paused}
@keyframes tsc{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:0 16px;border-right:1px solid #f0f0f0}
.tn{color:#666;font-weight:500}.tv{font-weight:700;color:#111}.tc{font-size:10.5px}
.up{color:var(--green)}.dn{color:var(--red)}

.wrap{max-width:1360px;margin:0 auto;padding:12px 14px}
.sec{display:none}.sec.on{display:block}
.stitle{font-family:'Teko',sans-serif;font-size:21px;font-weight:600;color:var(--blue);border-bottom:2px solid var(--mc);padding-bottom:5px;margin-bottom:12px}
.stitle-sm{font-family:'Teko',sans-serif;font-size:16px;font-weight:600;color:var(--blue);border-bottom:1px solid #ddd;padding-bottom:3px;margin:12px 0 8px}

.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:50px;color:#999;font-size:13px}
.spin{width:20px;height:20px;border:2px solid #ddd;border-top-color:var(--mc);border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}

/* TABLE CARD */
.tcw{background:#fff;border:1px solid var(--bdr);border-radius:5px;margin-bottom:12px;overflow:hidden}
.tch{background:var(--bgh);padding:8px 12px;font-size:12px;font-weight:700;color:var(--blue);border-bottom:1px solid #dce6ff;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.cnt{font-size:10px;background:var(--mc);color:#fff;padding:1px 8px;border-radius:10px;font-weight:600}
.tscr{overflow-x:auto;-webkit-overflow-scrolling:touch}
thead tr{background:#fafbff}
thead th{font-size:11px;font-weight:700;color:#555;border-bottom:1px solid #eee;padding:7px 10px;white-space:nowrap}
tbody tr{border-bottom:1px solid #f5f5f5}
tbody tr:hover{background:#f8fbff}
tbody td{font-size:12px;color:#222;padding:7px 10px;white-space:nowrap}
.cp{color:var(--green);font-weight:600}.cn{color:var(--red);font-weight:600}
.bd{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700}
.bd-g{background:#e6f4ee;color:#1a7a4a}.bd-a{background:#fff3e0;color:#e07b00}

/* INDEX CARDS */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;margin-bottom:12px}
.icard{background:#fff;border:1px solid var(--bdr);border-radius:5px;padding:10px 12px;transition:.2s}
.icard:hover{border-color:var(--mc);box-shadow:0 2px 10px rgba(0,96,223,.1)}
.iname{font-size:12px;font-weight:700;color:#222;margin-bottom:3px;line-height:1.3;white-space:normal}
.iprc{font-family:'Teko',sans-serif;font-size:21px;color:#111;line-height:1}
.ichs{display:flex;gap:6px;font-size:11px;margin-top:3px;flex-wrap:wrap}
.ihl{font-size:10px;color:#bbb;margin-top:3px}
.itm{font-size:9px;color:#ccc;margin-top:1px}

/* GIFT NIFTY CARD */
.gift-card{background:#fff;border:1px solid var(--bdr);border-radius:5px;padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0;margin-bottom:12px}
.gift-col{padding:10px 14px;border-right:1px solid #f0f0f0}
.gift-col:last-child{border-right:none}
.gift-lbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.gift-val{font-family:'Teko',sans-serif;font-size:22px;font-weight:600;line-height:1}

/* 2-COL */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:650px){.g2{grid-template-columns:1fr}}

/* ADV/DEC */
.adrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:500px){.adrow{grid-template-columns:repeat(2,1fr)}}
.adbox{background:#fff;border:1px solid var(--bdr);border-radius:5px;padding:10px;text-align:center}
.adlbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.adnum{font-family:'Teko',sans-serif;font-size:26px;line-height:1}

/* IPO BADGES */
.sop{background:#e6f4ee;color:#1a7a4a;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700}
.scl{background:#fdecea;color:#c0392b;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700}
.sup{background:#fff8e1;color:#b45309;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700}

/* INVESTOR TABS */
.itabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.itb{padding:5px 12px;border:1px solid #ddd;border-radius:3px;font-size:11px;font-weight:600;cursor:pointer;background:#fff;color:#555;transition:.15s;font-family:'Inter',sans-serif}
.itb:hover{border-color:var(--mc);color:var(--mc)}.itb.on{background:var(--mc);color:#fff;border-color:var(--mc)}
.ipanel{display:none}.ipanel.on{display:block}
.pvlbl{font-size:11px;color:#888;margin-bottom:8px}
.pvlbl strong{color:var(--blue);font-size:13px}
.disc{background:#fffde7;border:1px solid #ffe082;border-radius:5px;padding:10px 14px;font-size:11px;color:#6d4c00;margin-bottom:12px}

footer{background:#1a1a2e;color:#777;text-align:center;padding:16px;font-size:11px;margin-top:16px}
footer a{color:#6ea8fe}

@media(max-width:768px){
  .hdr{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
  nav{gap:3px;order:3;width:100%;padding-bottom:4px}
  .nb{font-size:10.5px;padding:5px 8px}
  .wrap{padding:10px}.stitle{font-size:18px}
  .igrid{grid-template-columns:repeat(2,1fr)}
  thead th,tbody td{padding:6px 8px;font-size:11px}
  .iprc{font-size:18px}
}
@media(max-width:380px){.nb{font-size:10px;padding:4px 7px}}

/* CORPORATE SUB-TABS */
.corp-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.corp-tab{padding:8px 16px;border-radius:4px;font-size:12px;font-weight:600;
  cursor:pointer;border:2px solid;background:#fff;transition:.2s;font-family:'Inter',sans-serif}
.corp-tab:hover{opacity:.85}
.corp-tab.on{color:#fff}
.corp-panel{display:none}.corp-panel.on{display:block}

.news-loading{color:#aaa;padding:20px;text-align:center;font-size:12px}
</style>
</head>

<script>
const SID='1xoUJqge0b4SQmZSRLZyoBBcokXrUrFVt8fBFoef28NQ';
const GIDS={dashboard:236316251,news:194974677,global:572014590,futures:2063758158,indian:139113774,market:1259430707,ipo:536891537,ipo2:536891537,currency:1847303228};
const SID2='1_7_7lctIPNdHjUd3wNp0hu6xMjqhG3Tw0fNJO_fxWJg';
const CORP_GIDS={today:203302293,dividends:1718274952,bonus:1235071159,splits:1616300885};

/* ── JSONP fetch ── */
let _n=0;
function fetchSheet(gid, opt){
  return new Promise((res,rej)=>{
    const cb='__gs_'+(++_n);
    const t=setTimeout(()=>{delete window[cb];rej(new Error('Timeout'));},20000);
    window[cb]=data=>{clearTimeout(t);delete window[cb];try{res(toRows(data));}catch(e){rej(e);}};
    const s=document.createElement('script');
    s.onerror=()=>{clearTimeout(t);delete window[cb];rej(new Error('Load failed GID '+gid));};
    s.src=`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?gid=${gid}${opt||'&tq=select%20*'}&tqx=out:json;responseHandler:${cb}&t=${Date.now()}`;
    document.head.appendChild(s);
    s.onload=()=>{try{document.head.removeChild(s);}catch(e){}};
  });
}

/* fetchSheet2 — for Corporate Actions (separate Google Sheet) */
async function fetchSheet2(gid){
  // Use CSV export — preserves merged cell company names that gviz skips
  const url=`https://docs.google.com/spreadsheets/d/${SID2}/export?format=csv&gid=${gid}&t=${Date.now()}`;
  const res=await fetch(url);
  if(!res.ok) throw new Error('CSV fetch failed: '+res.status);
  const text=await res.text();
  return parseCSV(text);
}

/* fetchSheetCSV — CSV export from main sheet (SID), avoids gviz type-inference issues */
async function fetchSheetCSV(gid){
  const url=`https://docs.google.com/spreadsheets/d/${SID}/export?format=csv&gid=${gid}&t=${Date.now()}`;
  const res=await fetch(url);
  if(!res.ok) throw new Error('CSV fetch failed: '+res.status);
  const text=await res.text();
  return parseCSV(text);
}

/* fetchIPOTypes — fetches cols A,F,G from IPO sheet forcing gviz to return Date/Type columns.
   Filters to only GMP rows (G contains SME/Mainboard) to avoid collisions with other sections. */
function fetchIPOTypes(){
  return fetchSheet(GIDS.ipo, '&tq=select%20A%2CF%2CG%20where%20G%20contains%20%27SME%27%20or%20G%20contains%20%27Mainboard%27%20or%20G%20contains%20%27Main%20Board%27');
}

function parseCSV(text){
  const rows=[];
  const lines=text.split(/\r?\n/);
  for(const line of lines){
    if(!line.trim()) continue;
    const cells=[];
    let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'&&!inQ){inQ=true;continue;}
      if(ch==='"'&&inQ&&line[i+1]==='"'){cur+='"';i++;continue;}
      if(ch==='"'&&inQ){inQ=false;continue;}
      if(ch===','&&!inQ){cells.push(cur.trim());cur='';continue;}
      cur+=ch;
    }
    cells.push(cur.trim());
    rows.push(cells);
  }
  return rows;
}
function toRows(data){
  if(!data||!data.table||!data.table.rows) return [];
  return data.table.rows.map(row=>
    (row&&row.c?row.c:[]).map(c=>c?(c.f!=null?String(c.f):c.v!=null?String(c.v):'').trim():'')
  );
}

/* ── Helpers ── */
const $=id=>document.getElementById(id);
const f=v=>String(v||'').trim()||'—';
const clean=v=>String(v||'').replace(/\*/g,'').trim();
function ic(v){
  const s=String(v||'').replace(/,/g,'').replace(/\*/g,'').trim();
  if(!s||s==='—'||s==='-') return '';
  const n=parseFloat(s);
  return isNaN(n)?'':n<0?'cn':n>0?'cp':'';
}
function pctFmt(v){const s=String(v||"").trim();if(!s||s==="—")return "—";return s.includes("%")?s:s+"%";}
function icard(name,price,chg,pct,hi,lo,tm,hl){
  const pos=!String(chg||"").trim().startsWith("-");
  const hls=hl?"border:2px solid #e07b00;background:#fffbf0;":"";
  return `<div class="icard" style="${hls}">
    <div class="iname" style="${hl?"font-weight:700;color:#b85c00;":""}">${f(name)}</div>
    <div class="iprc">${f(price)}</div>
    <div class="ichs"><span class="${pos?"up":"dn"}">${f(chg)}</span><span class="${pos?"up":"dn"}">${pctFmt(pct)}</span></div>
    <div class="ihl">H:${f(hi)} &nbsp;L:${f(lo)}</div>
    ${tm?`<div class="itm">${f(tm)}</div>`:""}
  </div>`;
}
function sbadge(s){
  const l=(s||'').toLowerCase();
  if(l.includes('open')) return '<span class="sop">OPEN</span>';
  if(l.includes('upcoming')) return '<span class="sup">UPCOMING</span>';
  if(l.includes('clos')) return '<span class="scl">CLOSED</span>';
  return s?`<span class="bd bd-g">${s}</span>`:'—';
}
function tbadge(t){return `<span class="bd ${/main/i.test(t||'')?'bd-a':'bd-g'}">${clean(t)||'—'}</span>`;}

const SECT_TH=`<thead><tr><th>Index</th><th>Price</th><th>Chg</th><th>%Chg</th><th>52W High</th><th>52W Low</th></tr></thead>`;
const STOCK_TH=`<thead><tr><th>Company</th><th>Price ₹</th><th>Chg</th><th>%Chg</th><th>52W High</th><th>52W Low</th></tr></thead>`;
const MKT_TH4=`<thead><tr><th>Company</th><th>Price ₹</th><th>Change</th><th>% Chg</th></tr></thead>`;
const MKT_TH3=`<thead><tr><th>Company</th><th>Price ₹</th><th>% Chg</th></tr></thead>`;

function renderDashboard(rows, newsRows){
  newsRows = newsRows || [];
  /*
  Row 0  (idx 0):  "Economic times Top stories" header
  Rows 1-5  (idx 1-5):   col[0]=Title  col[1]=URL  col[2]=Date
  Row 6  (idx 6):  "Economic times Recent Stories" header
  Rows 7-11 (idx 7-11):  col[0]=Title  col[1]=URL  col[2]=Date
  Row 12 (idx 12): "Livemint Company News" header
  Rows 13-17(idx 13-17): col[0]=Title  col[1]=URL  col[2]=Date
  Row 18 (idx 18): "Livemint Market News" header
  Rows 19-23(idx 19-23): col[0]=Title  col[1]=URL  col[2]=Date
  Row 24 (idx 24): "Indian Indices" header
  Row 25 (idx 25): column headers
  Rows 26-33(idx 26-33): col[0]=Index col[1]=Price col[2]=Change col[3]=%Chg
  Row 34 (idx 34): "Global Indices" header
  Row 35 (idx 35): column headers
  Rows 36-40(idx 36-40): col[0]=Index col[1]=Price col[2]=Change col[3]=%Chg
  Row 41 (idx 41): FII/DII headers
  Rows 42-43(idx 42-43): col[0]=Date col[1]=Net FII col[2]=Net DII
  */

  /* Sheet has news in IMPORTFEED rows — gviz returns them when sheet is loaded.
     Detect by col[1] containing URL (http).
     News rows: col[0]=Title, col[1]=URL, col[2]=Date
     Index rows: col[0]=name, col[1]=numeric price
     FII rows: col[0]=date (contains 2026), col[1]=Net FII, col[2]=Net DII
  */
  console.log('DB rows:',rows.length, rows.slice(0,5).map((r,i)=>`[${i}]${r[0]?.substring(0,20)}|${r[1]?.substring(0,20)}|${r[2]?.substring(0,15)}`).join(' || '));
 if(!newsRows.length) newsRows = rows.filter(r=>(r[1]||'').includes('http')&&r[0]&&r[0].trim());
  else {
    // News sheet: row1=NEWS FEED header, row2=subheader, row3+ = data
    // col[0]=section label (or blank), col[1]=headline, col[2]=URL, col[3]=date
    // Skip header rows (no URL in col[2]), keep only real news rows, remap to [headline, url, date]
    newsRows = newsRows
      .filter(r=>(r[2]||'').includes('http') && r[1] && r[1].trim())
      .map(r=>[r[1], r[2], r[3]]);
  }
  const idxRows   = rows.filter(r=>r[0]&&r[0].trim()&&r[1]&&!isNaN(parseFloat(String(r[1]).replace(/,/g,'')))&&!(r[0]||'').includes('2026'));
  const fiiDii    = rows.filter(r=>r[0]&&(r[0].includes('2026')||r[0].includes('-06-'))&&r[1]&&!isNaN(parseFloat(String(r[1]).replace(/,/g,''))));

  // 4 sections of 5 news each
  const etTop     = newsRows.slice(0,  5);
  const etRecent  = newsRows.slice(5,  10);
  const lmCompany = newsRows.slice(10, 15);
  const lmMarket  = newsRows.slice(15, 20);

  // Indices: first 8 = Indian, next 5 = Global
  const indIdx    = idxRows.slice(0, 8);
  const glbIdx    = idxRows.slice(8, 13);

  // News block builder from sheet data
  function newsBlock(title, icon, items, color, elId){
    if(!items.length) return `<div class="tcw"><div class="tch" style="color:${color}">${icon} ${title}</div><div class="news-loading">No data</div></div>`;
    return `<div class="tcw">
      <div class="tch" style="color:${color}">${icon} ${title}</div>
      <div>${items.map(r=>`
        <div style="padding:10px 14px;border-bottom:1px solid #f5f5f5">
          <a href="${(r[1]||'').trim()}" target="_blank" rel="noopener"
             style="font-size:12.5px;font-weight:500;color:#1a1a1a;text-decoration:none;line-height:1.5;display:block"
             onmouseover="this.style.color='var(--mc)'"
             onmouseout="this.style.color='#1a1a1a'">
            ${f(r[0])}
          </a>
          <div style="font-size:10px;color:#aaa;margin-top:3px">${formatNewsDate(r[2]||'')}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // News section: col[0]=headline col[1]=url col[2]=time
  // Index table
  const idxTH = `<thead><tr><th>Index</th><th>Price</th><th>Change</th><th>% Chg</th></tr></thead>`;
  const idxRow = r => `<tr>
    <td><strong>${f(r[0])}</strong></td>

function formatNewsDate(d){
  if(!d) return '';
  try{
    const dt=new Date(d);
    if(isNaN(dt)) return d.split(' ').slice(0,4).join(' ');
    return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  }catch(e){return '';}
}

/* ══════════════════════════════════════════════
   FIX 2: GLOBAL INDICES
   Cols: [2]=Name [3]=Price [4]=Change [5]=%Chg [6]=High [7]=Low [8]=Time
   First 3 rows after header = India (NIFTY, SENSEX, VIX)
   Row 0 (index 0) is the header row — skip it
   DOW is at row index 4 (after NIFTY,SENSEX,VIX) → World, NOT India
══════════════════════════════════════════════ */
function renderGlobal(rows){
  /* EXACT sheet structure (confirmed from screenshot):
     Sheet col A (gviz [0]) = blank
     Sheet col B (gviz [1]) = flag/logo image (blank in gviz)
     Sheet col C (gviz [2]) = INDEX NAME
     Sheet col D (gviz [3]) = Price
     Sheet col E (gviz [4]) = Change
     Sheet col F (gviz [5]) = % Chg
     Sheet col G (gviz [6]) = Today's High
     Sheet col H (gviz [7]) = Today's Low
     Sheet col I (gviz [8]) = Last Updated Time (IST)
     Row 1 = headers (gviz index 0)
     Row 2 = NIFTY 50 (gviz index 1)
     Row 3 = SENSEX   (gviz index 2)
     Row 4 = INDIA VIX (gviz index 3)
     Row 5+ = World indices
  */
  // From console debug: gviz row0=header, row1=SENSEX, row2=INDIA VIX, row3=DOW...
  // NIFTY 50 (sheet row 2) is skipped by gviz — likely due to image in col B
  // FIX: India = first 3 rows of allData by position (rows 1,2,3 in gviz = NIFTY50,SENSEX,VIX)
  // But since NIFTY 50 is skipped, India = rows 1,2 and we manually add NIFTY 50 from ticker

  // Use position-based split: first 2 data rows = India, rest = World
  // Also include any row whose name contains NIFTY 50 in case gviz starts returning it
  let NC=2;
  const testRow = rows[1]||[];
  for(let ci=0;ci<6;ci++){
    const v=(testRow[ci]||'').toUpperCase();
    if(v.includes('NIFTY')||v.includes('SENSEX')){NC=ci;break;}
  }
  const PC=NC+1,CC=NC+2,FC=NC+3,HC=NC+4,LC=NC+5,TC=NC+6;

  const allData = rows.slice(1).filter(r =>
    r[NC] && r[NC].trim() &&
    !r[NC].includes('candle') && !r[NC].includes('Click')
  );

  // India = first 3 rows by position (sheet rows 2,3,4 = NIFTY 50, SENSEX, INDIA VIX)
  // Even if NIFTY 50 is skipped by gviz, SENSEX+VIX will be rows 0,1 of allData
  // World = everything from index 3 onwards (or 2 if NIFTY 50 skipped)
  const INDIA_NAMES = ['NIFTY','SENSEX','VIX'];
  const india = allData.filter(r => INDIA_NAMES.some(k => (r[NC]||'').toUpperCase().includes(k)));
  const world = allData.filter(r => !INDIA_NAMES.some(k => (r[NC]||'').toUpperCase().includes(k)));

  // gviz skips NIFTY 50 (sheet row 2) — try to recover it from rows[0] if it's a data row
  // Also check if it appears anywhere in rows with 'NIFTY 50' text
  const niftyRow = rows.find(r => (r[NC]||'').toUpperCase().trim() === 'NIFTY 50');
  const indiaWithNifty = niftyRow
    ? [niftyRow, ...india.filter(r=>(r[NC]||'').toUpperCase().trim()!=='NIFTY 50')]
    : india;

  const mkCard = r => icard(r[NC], r[PC], r[CC], r[FC], r[HC], r[LC], r[TC]);

  $('s-global').innerHTML=`
    <div class="stitle">🌍 Global Indices</div>
    <div class="stitle-sm">India</div>
    <div class="igrid">${indiaWithNifty.map(mkCard).join('')}</div>
    <div class="stitle-sm">🌐 World Markets</div>
    <div class="igrid">${world.map(mkCard).join('')}</div>
    <p style="font-size:10px;color:#bbb;margin-top:6px">⚠️ Quotes delayed up to 20 min. Source: Google Finance. Not investment advice.</p>`;
}

  // ── SLICES ──────────────────────────────────────────────────────

// Adv/Dec: col I (gviz[8]), rows 38-41 (gviz idx 37-40)
const bseAdv = (rows[28]||[])[8] || '—';
const bseDec = (rows[29]||[])[8] || '—';
const nseAdv = (rows[30]||[])[8] || '—';
const nseDec = (rows[31]||[])[8] || '—';

  // ── TABLE BUILDERS ───────────────────────────────────────────────

/* ══════════════════════════════════════════════
   FIX 4: IPO CORNER
   Three completely SEPARATE tables — must not merge:
   1) Listed IPOs:  rows 2..N, cols [0]=Name [1]=Type [2]=Date [3]=IssuePrice [4]=Subs [5]=ListOpen [6]=ListClose [7]=ListGain [8]=LTP [9]=TodayGain [10]=Size
   2) GMP: starts after row where col[1]="Grey Market Premium"
            header row: col[0]="*IPO Name*" etc
            data: col[0]=Name [1]=GMP [2]=Trend [3]=PriceBand [4]=EstListing [5]=Date [6]=Type [7]=Status
   3) Subscription: starts after row where col[1]="IPO Subscription Status Application-wise"
            header: col[0]="IPO" col[1]="Type" col[2]="Opening Date"...
            data: col[0]=IPO [1]=Type [2]=Open [3]=Close [4]=QIB [5]=NII [6]=Retail [7]=Total
   KEY FIX: Use SEPARATE section detection — stop each section at next blank block
══════════════════════════════════════════════ */
/* patchIPOTypes — merges col F (Date) and col G (Type) from a dedicated fetch into the main rows array.
   gviz blanks these cols when other sections don't use them consistently; the targeted fetch forces them. */
function patchIPOTypes(rows, typeRows){
  if(!typeRows||!typeRows.length) return rows;
  // typeRows: [0]=A=name, [1]=F=date, [2]=G=type
  const map={};
  typeRows.forEach(r=>{ if(r[0]) map[String(r[0]).trim().toLowerCase()]={date:r[1],type:r[2]}; });
  return rows.map(r=>{
    if(!r[0]) return r;
    const key=String(r[0]).trim().toLowerCase();
    const m=map[key];
    if(!m) return r;
    const nr=[...r];
    if(m.date && !nr[5]) {
      let d=String(m.date);
      const dm=d.match(/^Date\((\d+),(\d+),(\d+)\)/);
      if(dm) d=new Date(+dm[1],+dm[2],+dm[3]).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
      nr[5]=d;
    }
    if(m.type && !nr[6]) nr[6]=m.type;
    return nr;
  });
}

  /* CONFIRMED from CSV:
     Recently Listed: idx 2-21  col[0-10]
     GMP data:        idx 25-35 col[0-8]
     Issue Dates:     idx 39-47 col[0]
     Experts:         idx 50-69 col[0-5]
     Subscription:    idx 72-164 col[0-7]
  */
  const st = v => String(v||'').replace(/\*/g,'').trim() || '—';

 // Use dynamic section detection instead of hardcoded indices
  // because gviz skips blank/merged rows causing index drift
  const findIdx = (keyword, col=1) => rows.findIndex(r => String(r[col]||'').toLowerCase().includes(keyword.toLowerCase()));
  const clean = v => String(v||'').replace(/\*/g,'').trim().toLowerCase();

  const gmpStart     = findIdx('Grey Market Premium');
  const datesStart   = findIdx('Issue Date', 0) > -1 ? rows.findIndex(r=>String(r[1]||'').trim()==='' && String(r[0]||'').includes('Comp')) : findIdx('Issue Date');
  const expertsStart = rows.findIndex(r =>
    String(r[1]||'').toLowerCase().includes('expert') ||
    String(r[0]||'').toLowerCase().includes('expert'));
  const subsStart    = findIdx('IPO Subscription Status');

  const listed  = rows.slice(1, gmpStart > 0 ? gmpStart : 22)
                      .filter(r => r[0]&&r[0].trim()&&r[0]!=='Company Name');
  const gmpEnd  = rows.findIndex((r,i) => i > gmpStart && clean(r[0])==='company' && String(r[1]||'').toLowerCase().includes('issue date'));
  const gmp     = gmpStart > 0
                ? rows.slice(gmpStart+2, gmpEnd > 0 ? gmpEnd : gmpStart+15)
                      .filter(r => r[0]&&r[0].trim()&&clean(r[0])!=='ipo name'&&r[1]&&r[1].trim()&&r[1].trim()!=='—')
                : [];
  const expertsEnd = subsStart > 0 ? subsStart : expertsStart + 25;
  const experts = expertsStart > 0
                ? rows.slice(expertsStart+2, expertsEnd)
                      .filter(r => r[0]&&r[0].trim()&&clean(r[0])!=='company')
                : [];
  const subs    = subsStart > 0
                ? rows.slice(subsStart+2)
                      .filter(r => r[0]&&r[0].trim()&&clean(r[0])!=='ipo')
                : [];

  // Issue Dates: rows between GMP end and Experts start
  const datesHeaderIdx = rows.findIndex(r =>
    clean(r[0])==='company' && String(r[1]||'').toLowerCase().includes('issue date'));
  const dates = datesHeaderIdx > 0
    ? rows.slice(datesHeaderIdx+1, expertsStart > 0 ? expertsStart : datesHeaderIdx+15)
          .map(r=>r[0]).filter(v=>v&&v.trim())
    : [];

  const sbadge = s => {
    const l=(s||'').toLowerCase();
    if(l.includes('open'))     return '<span class="sop">OPEN</span>';
    if(l.includes('upcoming')) return '<span class="sup">UPCOMING</span>';
    if(l.includes('clos'))     return '<span class="scl">CLOSED</span>';
    return s||'—';
  };
  const tbadge = t => `<span class="bd ${/main/i.test(st(t))?'bd-a':'bd-g'}">${st(t)||'—'}</span>`;

  const TABS = [
    {
      k:'listed', label:'📈 Listed', count:listed.length, color:'#1a7a4a',
      html:`<div class="tscr"><table>
        <thead><tr><th>Company</th><th>Type</th><th>Listed</th><th>Issue ₹</th>
          <th>Subs</th><th>List Open</th><th>List Close</th><th>List Gain</th>
          <th>LTP ₹</th><th>Today's Gain</th><th>Size</th></tr></thead>
        <tbody>${listed.map(r=>`<tr>
          <td><strong>${f(r[0])}</strong></td><td>${tbadge(r[1])}</td>
          <td>${f(r[2])}</td><td>${f(r[3])}</td><td>${f(r[4])}</td>
          <td>${f(r[5])}</td><td>${f(r[6])}</td>
          <td class="${ic(r[7])}">${f(r[7])}</td>
          <td>${f(r[8])}</td>
          <td class="${ic(r[9])}">${f(r[9])}</td>
          <td>${f(r[10])}</td>
        </tr>`).join('')}</tbody>
      </table></div>`
    },
    {
      k:'gmp', label:'📋 GMP', count:gmp.length, color:'#0d47a1',
      html:`<div class="tscr"><table>
        <thead><tr><th>IPO Name</th><th>GMP</th><th>Price Band</th>
          <th>Est. Listing</th><th>Date</th><th>Type</th><th>Updated</th></tr></thead>
        <tbody>${gmp.map(r=>`<tr>
          <td><strong>${st(r[0])}</strong></td>
          <td class="${ic(st(r[1]))}" style="font-weight:600">${st(r[1])}</td>
          <td>${st(r[3])}</td><td>${st(r[4])}</td><td>${st(r[5])}</td>
          <td>${tbadge(r[6])}</td>
          <td style="color:#aaa;font-size:11px">${st(r[8])}</td>
        </tr>`).join('')}</tbody>
      </table></div>`
    },
    {
      k:'experts', label:"🎓 Expert's Advice", count:experts.length, color:'#e07b00',
      html:`<div class="tscr"><table>
        <thead><tr><th>Company</th>
          <th style="color:var(--green)">Apply</th>
          <th style="color:var(--orange)">Neutral</th>
          <th style="color:var(--red)">Avoid</th>
          <th style="color:#aaa">Not Rated</th></tr></thead>
        <tbody>${experts.map(r=>`<tr>
          <td><strong>${f(r[0])}</strong></td>
          <td style="color:var(--green);font-weight:600;text-align:center">${f(r[1])}</td>
          <td style="color:var(--orange);text-align:center">${f(r[3])}</td>
          <td style="color:var(--red);font-weight:600;text-align:center">${f(r[4])}</td>
          <td style="color:#aaa;text-align:center">${f(r[5])}</td>
        </tr>`).join('')}</tbody>
      </table></div>`
    },
    {
      k:'subs', label:'📅 Subscription', count:subs.length, color:'#6a1b9a',
      html:`<div class="tscr"><table>
        <thead><tr><th>IPO</th><th>Type</th><th>Opening Date</th><th>Closing Date</th>
          <th>QIB (X)</th><th>NII (X)</th><th>Retail (X)</th><th>Total (X)</th></tr></thead>
        <tbody>${subs.map(r=>`<tr>
          <td><strong>${f(r[0])}</strong></td><td>${tbadge(r[1])}</td>
          <td>${f(r[2])}</td><td>${f(r[3])}</td>
          ${[4,5,6,7].map(i=>{const v=parseFloat(r[i]);return`<td class="${isNaN(v)?'':v>=10?'cp':v>=1?'':'cn'}">${f(r[i])}</td>`;}).join('')}
        </tr>`).join('')}</tbody>
      </table></div>`
    },
    {
      k:'dates', label:'📆 Issue Dates', count:dates.length, color:'#555555',
      html:`<div style="padding:10px 14px;columns:2;column-gap:20px">
        ${dates.map(d=>`<div style="padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:12px;break-inside:avoid">
          📌 ${d}
        </div>`).join('')}
      </div>`
    },
  ];

  $('s-ipo').innerHTML=`
    <div class="stitle">🏦 IPO Corner</div>

    <div class="corp-tabs">
      ${TABS.map((t,i)=>`
        <button class="corp-tab${i===0?' on':''}"
          id="ipotab-${t.k}"
          style="border-color:${t.color};${i===0?`background:${t.color};color:#fff`:''}"
          onclick="showIPOTab('${t.k}',this,'${t.color}')">
          ${t.label}
          <span style="margin-left:6px;font-size:10px;padding:1px 6px;border-radius:10px;
            background:${i===0?'rgba(255,255,255,0.3)':t.color+'22'};
            color:${i===0?'#fff':t.color}">
            ${t.count}
          </span>
        </button>`).join('')}
    </div>

    ${TABS.map((t,i)=>`
      <div class="corp-panel${i===0?' on':''}" id="ipopanel-${t.k}">
        <div class="tcw">

}

/* ══════════════════════════════════════════════
   FIX 5: ACE INVESTORS — complete data
   CSV structure:
   - Investor header row: col[0]='' col[1]='' col[2]=INVESTOR NAME col[6]='Portfolio Value:' col[7]=amount
   - Next row: col headers (skip)
   - Data rows: col[0]=S.No.(number), col[1]=Company, col[2..6]=quarterly %, col[7]=ValueCr
   - Blank rows between investors (all cols empty)
   FIX: Collect ALL rows until next investor header or end — don't stop at blank rows
══════════════════════════════════════════════ */
function renderCorporate(){
  /*
  4 sub-sheets from SID2 — card format (5 rows per stock entry):
    Row 0: col[1] = Company Name
    Row 1: col[1]='LTP'  col[3]=price  col[4]=% change
    Row 2: col[1]=label  col[3]=value  (Dividend/Ratio/Premium)
    Row 3: col[1]='Announcement Date'  col[3]=date
    Row 4: col[1]='Ex-Date'  col[3]=date

  GIDs: dividends=1718274952, bonus=1235071159, splits=1616300885, rights=1541450036
  */

  /* CONFIRMED CSV structure (from direct CSV analysis):
     Company row: col[1]=Name, col[2]=EMPTY, col[3]=EMPTY
     LTP row:     col[1]='LTP', col[3]=Price, col[4]=%Change
     Value row:   col[1]='Dividend/Ratio', col[3]=Value
     Ann row:     col[1]='Announcement Date', col[3]=Date
     ExDate row:  col[1]='Ex-Date', col[3]=Date
     Rights extra:col[1]='Premium', col[3]=Value (between Ratio and AnnDate)

     KEY DETECTION: company row has col[2] EMPTY (no label in col C)
                    all label rows have col[2] filled with the label text
     rowSize: 5 for Div/Bonus/Splits, 6 for Rights
  */
  function parseCards(rows, rowSize){
    /* CSV structure (company name row IS present in CSV fetch):
       Row 0: col[1]=CompanyName  (col[3] empty)
       Row 1: col[1]='LTP'        col[3]=price  col[4]=%
       Row 2: col[1]='Dividend/Ratio' col[3]=value
       Row 3: col[1]='Ann. Date'  col[3]=date
       Row 4: col[1]='Ex-Date'    col[3]=date
       Rights (rowSize=6):
       Row 0: company, Row1: LTP, Row2: Ratio, Row3: Premium, Row4: AnnDate, Row5: ExDate
    */
    const cards = [];
    let i = 0;
    while(i < rows.length){
      const r0 = rows[i]||[];
      const company = (r0[1]||'').trim();
      // Company row: col[1]=name, col[3]=empty
      if(!company||(r0[3]||'').trim()){ i++; continue; }

      const r1=rows[i+1]||[];  // LTP
      const r2=rows[i+2]||[];  // Dividend/Ratio
      const r3=rows[i+3]||[];  // AnnDate (non-rights) / Premium (rights)
      const r4=rows[i+4]||[];  // ExDate (non-rights) / AnnDate (rights)
      const r5=rows[i+5]||[];  // ExDate (rights only)

      const ltp=(r1[3]||'').trim()||'—';
      const pct=(r1[4]||'').trim()||'—';
      const pos=pct.includes('+');

      if(rowSize===6){
        cards.push({company,ltp,pct,pos,
          value:  (r2[3]||'').trim()||'—',
          extra:  (r3[3]||'').trim()||'—',
          annDate:(r4[3]||'').trim()||'—',
          exDate: (r5[3]||'').trim()||'—',
        });
      } else {
        cards.push({company,ltp,pct,pos,
          value:  (r2[3]||'').trim()||'—',
          extra:  '',
          annDate:(r3[3]||'').trim()||'—',
          exDate: (r4[3]||'').trim()||'—',
        });
      }
      i += rowSize;
    }
    return cards;
  }

  // Today's corporate actions (GID 203302293) — flat table
  // col[0]=Company col[1]=EventType col[2]=AnnouncedDate col[3]=ExDate col[4]=Dividend col[5]=Ratio
  function parseTodayActions(rows){
    // col[0]=Company col[1]=EventType col[2]=AnnouncedDate col[3]=ExDate col[4]=Dividend col[5]=Ratio
    // Skip header row only if first row's col[0] looks like a header label
    const headerWords = ['company','event','type','announced'];
    const isHeader = rows[0] && headerWords.some(w=>(rows[0][0]||'').toLowerCase().includes(w));
    return rows.slice(isHeader?1:0).filter(r => r[0]&&r[0].trim()&&r[0].toLowerCase().trim()!=='no data found');
  }

  const todayData  = parseTodayActions(DATA['corp_today']  || []);
  const divData    = parseCards(DATA['corp_dividends'] || [], 5);
  const bonusData  = parseCards(DATA['corp_bonus']     || [], 5);
  const splitData  = parseCards(DATA['corp_splits']    || [], 5);

  function makeTable(cards, valHeader, showExtra=false, extraHeader='Details'){
    if(!cards.length) return '<p style="padding:20px;color:#aaa;text-align:center">No data available</p>';
    return `<div class="tscr"><table>
      <thead><tr>
        <th>Company</th>
        <th>LTP (₹)</th>
        <th>Change</th>
        <th>${valHeader}</th>
        <th>Announced</th>
        <th>Ex-Date</th>
        ${showExtra?`<th>${extraHeader}</th>`:''}
      </tr></thead>
      <tbody>${cards.map(c=>`<tr>
        <td><strong>${c.company}</strong></td>
        <td>${c.ltp}</td>
        <td class="${c.pct.includes('-')?'cn':'cp'}">${c.pct}</td>
        <td style="font-weight:600;color:var(--blue)">${c.value}</td>
        <td style="color:#888;font-size:11px">${c.annDate}</td>
        <td style="font-weight:600">${c.exDate}</td>
        ${showExtra?`<td style="color:#888">${c.extra}</td>`:''}
      </tr>`).join('')}
      </tbody>
    </table></div>`;
  }

  // Today's actions table
  function makeTodayTable(rows){
    if(!rows.length) return '<p style="padding:20px;color:#aaa;text-align:center">No corporate actions today 🎉</p>';
    return `<div class="tscr"><table>
      <thead><tr><th>Company</th><th>Action</th><th>Announced Date</th><th>Ex-Date</th><th>Dividend (₹)</th><th>Ratio</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><strong>${f(r[0])}</strong></td>
        <td><span class="bd bd-g" style="background:#e8f0ff;color:#0d47a1">${f(r[1])}</span></td>
        <td style="color:#888;font-size:11px">${f(r[2])}</td>
        <td style="font-weight:600">${f(r[3])}</td>
        <td class="${f(r[4])!=='—'&&f(r[4])!=='-'?'cp':''}">${f(r[4])}</td>
        <td>${f(r[5])}</td>
      </tr>`).join('')}
      </tbody>
    </table></div>`;
  }

  const TABS = [
    {k:'today',  label:"Today's Events", count:todayData.length,  color:'#555555', html:makeTodayTable(todayData)},
    {k:'div',    label:'Dividends', count:divData.length,    color:'#1a7a4a', html:makeTable(divData,   'Dividend (₹)')},
    {k:'bonus',  label:'Bonus',     count:bonusData.length,  color:'#0d47a1', html:makeTable(bonusData, 'Ratio')},
    {k:'splits', label:'Splits',    count:splitData.length,  color:'#e07b00', html:makeTable(splitData, 'Split Ratio')},
  ];

  $('s-corporate').innerHTML = `
    <div class="stitle">📋 Corporate Actions</div>

    <div class="corp-tabs">
      ${TABS.map((t,i) => `
        <button class="corp-tab${i===0?' on':''}"
          id="ctab-${t.k}"
          style="border-color:${t.color};${i===0?`background:${t.color};color:#fff`:''}"
          onclick="showCorpTab('${t.k}',this,'${t.color}')">
          ${t.label}
          <span style="margin-left:6px;font-size:10px;padding:1px 6px;border-radius:10px;
            background:${i===0?'rgba(255,255,255,0.3)':''+t.color+'22'};
            color:${i===0?'#fff':t.color}">
            ${t.count}
          </span>
        </button>`).join('')}
    </div>

    ${TABS.map((t,i) => `
      <div class="corp-panel${i===0?' on':''}" id="cp-${t.k}">
        <div class="tcw">
          <div class="tch" style="color:${t.color}">${t.label} <span style="font-size:11px;color:#888;font-weight:400">${t.count} companies</span></div>
          ${t.html}
        </div>
      </div>`).join('')}

    <p style="font-size:10px;color:#bbb;margin-top:8px">
      Source: Niveshaka-bandhu Corporate Actions Sheet &nbsp;|&nbsp; Auto-refreshes every 5 min
    </p>`;
}

    const sp=b.querySelector('span');
    const bc=b.style.borderColor;

/* ── TICKER ── */
function buildTicker(gRows,fRows){
  const G_NAMES=['NIFTY 50','SENSEX','INDIA VIX','DOW JONES','NASDAQ','S&P 500','NIKKEI','SHENZEN','HANG SENG','IBOVESPA','EURONEXT','DAX','CAC 40'];
  const F_NAMES=['DOW FUTURES','NASDAQ FUTURES','FTSE FUTURES','EURO STOXX FUTURES','NIKKEI FUTURES','NIFTY FUTURES','GIFT NIFTY FUTURES','US DOLLAR INDEX','BITCOIN FUTURES'];

  const gItems=[], fItems=[];

  // Scan ALL rows (not slice(1)) to catch NIFTY 50 even if gviz puts it at row 0
  gRows.filter(r=>r[2]&&r[3]).forEach(r=>{
    const name=(r[2]||'').toUpperCase();
    if(!G_NAMES.some(k=>name.includes(k.toUpperCase()))) return;
    const pos=parseFloat(r[4]||'0')>=0;
    gItems.push(`<div class="ti"><span class="tn">${f(r[2])}</span><span class="tv">${f(r[3])}</span><span class="tc ${pos?'up':'dn'}">${pctFmt(r[5])}</span></div>`);
  });

  fRows.filter(r=>r[0]&&r[2]&&r[0]!=='Symbol'&&r[0]!=='Close'&&r[0]!=='Gift Nifty').forEach(r=>{
    const name=(r[0]||'').toUpperCase();
    if(!F_NAMES.some(k=>name.includes(k.toUpperCase()))) return;
    const pos=!String(r[3]||'').startsWith('-');
    fItems.push(`<div class="ti"><span class="tn">${f(r[0])}</span><span class="tv">${f(r[2])}</span><span class="tc ${pos?'up':'dn'}">${pctFmt(r[4])}</span></div>`);
  });

  // Row 1: Indices
  const t1=document.getElementById('tick1');
  const t2=document.getElementById('tick2');
  if(t1) t1.innerHTML=[...gItems,...gItems].join('')||'<div class="ti"><span class="tn">Loading…</span></div>';
  if(t2) t2.innerHTML=[...fItems,...fItems].join('')||'<div class="ti"><span class="tn">Loading…</span></div>';
}

    fetchSheet(GIDS.global).then(d=>{DATA.global=d;}).catch(e=>console.warn('global',e.message)),
    fetchSheet(GIDS.futures).then(d=>{DATA.futures=d;}).catch(e=>console.warn('futures',e.message)),
    fetchSheetCSV(GIDS.ipo).then(d=>{DATA.ipo=d; DATA.ipo2=[];}).catch(async e=>{
      console.warn('ipo csv failed, fallback gviz:',e.message);
      try{
        DATA.ipo  = await fetchSheet(GIDS.ipo,  '&tq=select%20*%20limit%2022%20offset%200');
        DATA.ipo2 = await fetchSheet(GIDS.ipo2, '&tq=select%20*%20limit%20200%20offset%2022');
      }catch(e2){console.warn('ipo gviz fallback failed',e2.message);}
    }),
    fetchIPOTypes().then(d=>{DATA.ipoTypes=d;}).catch(e=>console.warn('ipoTypes',e.message)),
  ]);
  if(DATA.dashboard?.length) try{renderDashboard(DATA.dashboard, DATA.news||[]);}catch(e){console.error('Dashboard',e);}
  if(DATA.global?.length)    try{renderGlobal(DATA.global);}catch(e){console.error('Global',e);}
  if(DATA.futures?.length)   try{renderFutures(DATA.futures);}catch(e){console.error('Futures',e);}
  try{buildTicker(DATA.global||[], DATA.futures||[]);}catch(e){}
  const now=new Date();
  $('ts').textContent=`Live · Updated ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} IST`;
  btn.textContent='⟳ Refresh'; btn.disabled=false;
}

// Track loaded tabs — dashboard, global, futures pre-loaded
const LOADED={'dashboard':true,'global':true,'futures':true};

async function loadTab(key){
  if(LOADED[key]) return; // already loaded
  LOADED[key]=true;
  const div=$('s-'+key);
  div.innerHTML='<div class="loading"><div class="spin"></div>Loading…</div>';

  try{
    if(key==='corporate'){
      await Promise.allSettled(Object.entries(CORP_GIDS).map(async([k,gid])=>{
        try{DATA['corp_'+k]=await fetchSheet2(gid);}catch(e){console.warn('corp_'+k,e.message);}
      }));
      renderCorporate();
    } else if(GIDS[key]){
      if(key==='ipo'){
        try{
          DATA.ipo=await fetchSheetCSV(GIDS.ipo); DATA.ipo2=[];
        }catch(e){
          console.warn('ipo csv failed, fallback gviz:',e.message);
          DATA.ipo  = await fetchSheet(GIDS.ipo,  '&tq=select%20*%20limit%2022%20offset%200');
          DATA.ipo2 = await fetchSheet(GIDS.ipo2, '&tq=select%20*%20limit%20200%20offset%2022');
        }
        try{ DATA.ipoTypes=await fetchIPOTypes(); }catch(e){}
      } else {
        DATA[key]=await fetchSheet(GIDS[key]);
      }
     if(key==='dashboard') renderDashboard(DATA.dashboard||[], DATA.news||[]);
      if(key==='futures')   renderFutures(DATA.futures||[]);
      if(key==='futures')   buildTicker(DATA.global||[],DATA.futures||[]);
      if(key==='indian')    renderIndian(DATA.indian||[]);
      if(key==='market')    renderMarket(DATA.market||[]);
      if(key==='ipo')       renderIPO(patchIPOTypes((DATA.ipo||[]).concat(DATA.ipo2||[]), DATA.ipoTypes||[]));
      if(key==='currency')  renderCurrency(DATA.currency||[]);
    }
  } catch(e){ console.error(key,e); }
}

async function refreshAll(){
  // Refresh all already-loaded tabs
  const btn=$('rbtn'); btn.textContent='⟳ Loading…'; btn.disabled=true;
  const keys=Object.keys(LOADED);
  await Promise.allSettled(keys.map(async k=>{
    try{
      if(k==='corporate'){
        await Promise.allSettled(Object.entries(CORP_GIDS).map(async([ck,gid])=>{
          try{DATA['corp_'+ck]=await fetchSheet2(gid);}catch(e){}
        }));
        renderCorporate();
      } else if(GIDS[k]){
        if(k==='ipo'){
          try{
            DATA.ipo=await fetchSheetCSV(GIDS.ipo); DATA.ipo2=[];
          }catch(e){
            console.warn('ipo csv failed, fallback gviz:',e.message);
            DATA.ipo  = await fetchSheet(GIDS.ipo,  '&tq=select%20*%20limit%2022%20offset%200');
            DATA.ipo2 = await fetchSheet(GIDS.ipo2, '&tq=select%20*%20limit%20200%20offset%2022');
          }
          try{ DATA.ipoTypes=await fetchIPOTypes(); }catch(e){}
        } else {
          DATA[k]=await fetchSheet(GIDS[k]);
        }
        if(k==='dashboard') renderDashboard(DATA.dashboard||[], DATA.news||[]);
        if(k==='global')   renderGlobal(DATA.global||[]);
        if(k==='futures')  renderFutures(DATA.futures||[]);
        if(k==='indian')   renderIndian(DATA.indian||[]);
        if(k==='market')   renderMarket(DATA.market||[]);
        if(k==='ipo')      renderIPO(patchIPOTypes((DATA.ipo||[]).concat(DATA.ipo2||[]), DATA.ipoTypes||[]));
        if(k==='currency') renderCurrency(DATA.currency||[]);
      }
    } catch(e){ console.error(k,e); }
  }));
  try{buildTicker(DATA.global||[],DATA.futures||[]);}catch(e){}
  const now=new Date();
  $('ts').textContent=`Live · Updated ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} IST`;
  btn.textContent='⟳ Refresh'; btn.disabled=false;
}

function showTab(key,btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  $('s-'+key).classList.add('on'); btn.classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
  loadTab(key); // lazy load if not yet loaded
}
function showInv(id,btn){
  document.querySelectorAll('.ipanel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.itb').forEach(b=>b.classList.remove('on'));
  $(id).classList.add('on'); btn.classList.add('on');
}

loadAll();
setInterval(loadAll,5*60*1000);
</script>
